services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: creatorhire
      POSTGRES_USER: creatorhire
      POSTGRES_PASSWORD: creatorhire
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creatorhire -d creatorhire"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://creatorhire:creatorhire@db:5432/creatorhire?schema=public
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  migrate:
    build:
      context: .
      target: migrator
    env_file: .env
    environment:
      DATABASE_URL: postgresql://creatorhire:creatorhire@db:5432/creatorhire?schema=public
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
