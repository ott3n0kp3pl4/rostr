name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://creatorhire:creatorhire@localhost:5432/creatorhire?schema=public
      TELEGRAM_DEV_MODE: "true"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: creatorhire
          POSTGRES_USER: creatorhire
          POSTGRES_PASSWORD: creatorhire
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creatorhire -d creatorhire"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: PLAYWRIGHT_BROWSERS_PATH=0 pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
